# The `minimal-pwsh` agent preset (极简模式 (PowerShell)): a fixed-prompt,
# two-tool Windows coding-agent composition with PowerShell instead of bash.
#
# The persona is the complete system prompt, so global identity, Web orientation,
# tool guidance, and later assembly listeners cannot add prompt text. Runtime
# context snapshots are suppressed for this preset, and the model composes only
# the `pwsh` tool and `str_replace_editor`. Context compaction is absent.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# The host composition mounts `dsh-pwsh-sandbox` on win32 and its `shell`
# service is host-plane; this row only exposes the model-facing tool. The
# official minimal preset's persistent bash depends on a PTY backend that
# win32 rejects (`terminal inspection is unsupported on platform win32`), so
# this preset replaces it with the built-in per-call pwsh tool.
# `enableRunInBackground: false` keeps the two-tool surface honest: this
# preset mounts no `tool-jobs`, so the advertised parameter would otherwise
# fail at execute with "background jobs unavailable" (official minimal's bash
# exposes no background parameter either).
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
  config:
    enableRunInBackground: false

# The sandbox-enforcing filesystem shadows the host's provider only for this
# preset. Unlike the official minimal preset (bare fs-local leaves
# str_replace_editor unfenced in every mode — upstream discussion #2066),
# fs-sandbox reports sandboxMode so the editor builds a write policy:
# read-only denies mutations, workspace-write confines them to the workspace
# and temp roots, danger-full-access stays unfenced. The editor shares this
# realm and requires absolute paths.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-sandbox
      name: '@deepseek-ai/dsh-fs-sandbox'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000
