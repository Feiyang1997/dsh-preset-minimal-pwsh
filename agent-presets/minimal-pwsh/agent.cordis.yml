# The `minimal-pwsh` agent preset (极简模式 (PowerShell)): a fixed-prompt,
# two-tool Windows coding-agent composition with a PERSISTENT PowerShell shell.
#
# The persona is the complete system prompt, so global identity, Web orientation,
# tool guidance, and later assembly listeners cannot add prompt text. Runtime
# context snapshots are suppressed for this preset, and the model composes only
# the persistent `pwsh` tool and `str_replace_editor`. Context compaction is absent.
#
# The persistent-shell group mirrors the official minimal preset's win32 stack
# (rc8 added `tool-pwsh-persistent` plus the `shellDialect: pwsh` PTY backend
# and the win32 process inspector), so cwd and environment persist across calls.
# Rows stay win32-gated exactly like the official preset's.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# The PTY registry is an agent-owned service, so it lives in an entry-local
# realm. The backend still consumes the host sandbox policy and subprocess
# implementation, while the tool registers into this agent's scoped catalog.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

# The sandbox-enforcing filesystem shadows the host's provider only for this
# preset. Unlike the official minimal preset (bare fs-local leaves
# str_replace_editor unfenced in every mode — upstream discussion #2066),
# fs-sandbox reports sandboxMode so the editor builds a write policy:
# read-only denies mutations, workspace-write confines them to the workspace
# and temp roots, danger-full-access stays unfenced. The editor shares this
# realm and requires absolute paths.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-sandbox
      name: '@deepseek-ai/dsh-fs-sandbox'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000
